name: permission probe

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 用内置 token 试着创建并关闭一条 issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          num=$(gh api --method POST "/repos/${{ github.repository }}/issues" \
            -f title="[权限自检] workflow 内置 token 能否创建 issue" \
            -f body="这是权限自检自动创建的 issue，创建后立即关闭。" \
            --jq '.number')
          echo "created_issue_number=$num"
          gh issue close "$num" --comment "自检完成，自动关闭。"
          echo "probe_ok"
