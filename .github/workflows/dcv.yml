name: Cloudflare DCV auto

on:
  schedule:
    # 每天检查一次（03:23 UTC = 北京时间 11:23）
    - cron: "23 3 * * *"
    # 每月 1 号提交一次心跳，避免 60 天无提交导致 schedule 被自动停用
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印将要执行的动作，不修改任何东西"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-dcv
  cancel-in-progress: false

jobs:
  dcv:
    if: github.event_name != 'schedule' || github.event.schedule == '23 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 检查待验证证书、创建提醒 issue 并自动续订
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_NAME: mytemos.com
          DRY_RUN: ${{ inputs.dry_run }}
          NOTIFY_ISSUE: "true"
          CLOSE_ISSUES: "true"
          NOTIFY_MENTION: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          # 默认用仓库内置 token；若设置了 NOTIFY_GH_TOKEN 则改用你的个人 token
          GITHUB_TOKEN: ${{ secrets.NOTIFY_GH_TOKEN || github.token }}
        run: python3 dcv_auto.py

  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 提交心跳，保持定时任务不被停用
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/last-keepalive.txt
          git diff --quiet --cached || git commit -m "chore: keepalive $(date -u +%F)"
          git push
